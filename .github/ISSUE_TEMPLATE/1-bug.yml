name: Bug
description: Something fails, crashes, hangs, or sends or reads a wrong value.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Try the latest `main` first, and search the issues: add to one that matches.
        A vulnerability is never reported here: see SECURITY.md.
        A problem of the server, which turborel-client shows too, goes to turborel's own issues.
        Put a severe impact first in the title: `[DATA LOSS]`, `[WRONG RESULT]`, `[CRASH]` or `[REGRESSION]`.
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: The impact first, in a short paragraph. Then one sentence that sums it up.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Data sent or stored wrongly, or lost
        - Wrong value or row read
        - An exception that is not the driver's, a hang, or the interpreter brought down
        - Wrong error, SQLCODE or SQLSTATE
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest program that shows it, with the schema, the data and the statements it needs.
        Give the connection's settings, with any password left out.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, and why. Cite the protocol or the client library by its section if it says, e.g. `[PROTOCOL Frames]`, and what turborel-client does.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Give the exception, its SQLCODE, SQLSTATE and message, and the traceback.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it worked before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python
      description: "`python -VV`"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The operating system and version, and the architecture, e.g. "Ubuntu 24.04, x86_64".
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: The server's version, as `SERVER_VERSION` or `turboreld --version` gives it, and how the driver connected (TCP, TLS, a Unix socket or a named pipe).
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Diagnostics, how often it happens, what you ruled out.
