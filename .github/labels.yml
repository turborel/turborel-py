# Kinds
- name: "bug"
  color: "#d73a4a"
  description: "Something fails, crashes, hangs, or sends or reads a wrong value"
- name: "conformance"
  color: "#5c282b"
  description: "A departure from the protocol spec or from turborel-client"
- name: "performance"
  color: "#fbca04"
  description: "Slower than it was or should be, or too much memory"
- name: "feature"
  color: "#a2eeef"
  description: "Something turborel-py should do that it does not"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"

# Impact
- name: "impact/data-loss"
  color: "#b60205"
  description: "Data sent or stored wrongly through the driver, or lost"
- name: "impact/wrong-result"
  color: "#b60205"
  description: "A value or row read wrongly"
- name: "impact/crash"
  color: "#b60205"
  description: "An exception not the driver's, a hang, or the interpreter brought down"
- name: "impact/regression"
  color: "#b60205"
  description: "Worked, or was faster, at an earlier commit"

