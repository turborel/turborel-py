# Builds the package and checks it, run only by hand (VERSIONING.md,
# Publishing). It publishes nothing: the publish job is written, and
# disabled until a maintainer enables it, once every turborel driver is done.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.9"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
      - name: Every check, and the coverage floor
        run: |
          uv sync --locked
          uv run --locked python -m tools.verify --coverage
      - name: Build the sdist and the wheel
        run: uv build --no-sources
      - name: Check the packages' metadata as PyPI reads it
        run: uvx twine@7.0.0 check --strict dist/*
      - name: Install the wheel alone in a clean environment, and import it
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean" dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -I -c "import turborel; print(turborel.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # Disabled: a maintainer enables it, by removing this condition, once
    # every turborel driver is done and PyPI's trusted publisher for this
    # workflow and the environment `pypi` is set up.
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Publish to PyPI by trusted publishing
        run: uv publish --trusted-publishing always dist/*
